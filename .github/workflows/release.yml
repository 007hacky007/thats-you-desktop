name: release

# Builds the builder apps when a version tag is pushed and attaches them to a draft release.
# The draft is published by hand after checking it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            artifact: ThatsYou-Builder-macOS.dmg
          - os: windows-2022
            platform: win-x64
            artifact: ThatsYou-Builder-Windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: native/iwyknet/go.mod
          cache-dependency-path: native/iwyknet/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install PySide6==6.12.0 cryptography pyinstaller Pillow
      # macOS runs everything; Windows runs the tests of what the builder executes there (the
      # browser, Android and patch tools are macOS-only developer tools).
      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            python -m unittest discover -s tests
          else
            python -m unittest tests.test_inputs tests.test_pkg tests.test_builder_steps tests.test_builder_gui \
              tests.test_package tests.test_cf_account tests.test_unity_install tests.test_merge tests.test_tools \
              tests.test_config tests.test_net_config tests.test_portable tests.test_audio_graph tests.test_game_edits \
              tests.test_release_workflow
          fi
      - name: Network library
        shell: bash
        env:
          IWYK_WIN_CC: gcc
        run: |
          python -m pipeline.build_native --platform ${{ matrix.platform }}
          mkdir -p prebuilt/native
          cp -R work/native/${{ matrix.platform }} prebuilt/native/
      - name: Audio converter (macOS)
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          python -c "from pathlib import Path; from pipeline import audio_tools; import shutil; shutil.copy(audio_tools.ensure_vgmstream(Path('work')), 'prebuilt/vgmstream-cli')"
      - name: Package
        run: python -m builder.package --prebuilt prebuilt --out work/package
      - name: Self-test (macOS)
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: '"work/package/dist/That''s You! Builder.app/Contents/MacOS/That''s You! Builder" --self-test'
      - name: Self-test (Windows)
        if: matrix.platform == 'win-x64'
        run: work/package/ThatsYou-Builder-Windows.exe --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}
          path: |
            work/package/${{ matrix.artifact }}
            work/package/${{ matrix.artifact }}.sha256

  # Only this job can write to the repository, and it only publishes the built files as a draft.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Source archive
        run: git archive --format=tar.gz --prefix=thats-you-desktop/ -o dist/thats-you-desktop-source.tar.gz HEAD
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: dist/*
